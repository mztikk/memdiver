[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.1"
edition = "2024"
rust-version = "1.85"
authors = ["Nils Feierabend <mztikk@outlook.de>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/mztikk/memdiver"
homepage = "https://github.com/mztikk/memdiver"
keywords = ["memory", "process", "windows", "linux", "debugging"]
categories = ["os", "api-bindings", "development-tools::debugging"]

[workspace.dependencies]
bytemuck = "1"
bitflags = "2"
goblin = { version = "0.10", default-features = false, features = [
    "std",
    "endian_fd",
    "elf32",
    "elf64",
    "pe32",
    "pe64",
] }
libc = "0.2"
memchr = "2"
thiserror = "2"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Memory",
    "Win32_System_ProcessStatus",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
] }

memdiver-core = { path = "crates/memdiver-core", version = "0.1.1" }
memdiver-sys = { path = "crates/memdiver-sys", version = "0.1.1" }
memdiver = { path = "crates/memdiver", version = "0.1.1" }

[workspace.lints.rust]
missing_debug_implementations = "warn"
missing_docs = "warn"
unreachable_pub = "warn"
unsafe_op_in_unsafe_fn = "deny"
unused_lifetimes = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
